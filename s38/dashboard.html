
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard layout using named grid areas.">
  <title>Dashboard – Named Grid Areas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #e9ecf3;
    }

    .dashboard {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 220px 1fr 1fr 1fr;
      grid-template-rows: 64px auto 1fr 48px;
      grid-template-areas:
        "header header header header"
        "sidebar stat1 stat2 stat3"
        "sidebar chart chart activity"
        "footer footer footer footer";
      gap: 1rem;
    }

    .dashboard > * {
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
    }

    .header {
      grid-area: header;
      background: #1f2a44;
      color: #fff;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar {
      grid-area: sidebar;
      background: #2b3a67;
      color: #fff;
      border-radius: 0 10px 10px 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: .6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, .15);
    }

    .stat1 {
      grid-area: stat1;
    }

    .stat2 {
      grid-area: stat2;
    }

    .stat3 {
      grid-area: stat3;
    }

    .chart {
      grid-area: chart;
    }

    .activity {
      grid-area: activity;
    }

    .footer {
      grid-area: footer;
      border-radius: 0;
      text-align: center;
      font-size: .85rem;
    }

    .stat strong {
      display: block;
      font-size: 2rem;
      color: #2b3a67;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 160px;
      margin-top: 1rem;
    }

    .bars span {
      flex: 1;
      background: linear-gradient(#5c7cfa, #3b
