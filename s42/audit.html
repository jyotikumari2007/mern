
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsiveness audit with fixes applied."
    />
    <title>Responsive Audit &amp; Fixes</title>

    <!--
    AUDIT RESULTS (before → after)
    1. No viewport meta → Added viewport meta
    2. Fixed widths → Replaced with max-width + width: 100%
    3. Images overflowing → Added max-width: 100%
    4. Small font sizes → Used rem + clamp()
    5. Nav overlapping → Added flex-wrap: wrap
    6. Wide table → Added overflow-x: auto
    7. Small tap targets → Increased padding
    8. Cramped grid → Used auto-fit + minmax()
    -->

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        padding: 1rem;
        background: #f4f6fb;
      }

      .container {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        font-size: clamp(1.6rem, 5vw, 2.8rem);
        margin-bottom: 1rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      nav a {
        padding: 0.75rem 1rem;
        background: #1f3a93;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        min-height: 44px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }

      .card {
        background: #fff;
        padding: 1rem;
        border-radius: 10px;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }

      .table-wrap {
        overflow-x: auto;
        margin-top: 1.5rem;
        background: #fff;
      }

      table {
        border-collapse: collapse;
        min-width: 600px;
        width: 100%;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 0.6rem;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Responsive Audit – Fixed</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Pricing</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
      </nav>

      <div class="grid">
        <div class="card">
          <img
            src="https://picsum.photos/id/1011/800/500"
            alt="Boat on a quiet lake"
          />
          <h2>Card one</h2>
        </div>

        <div class="card">
          <img
            src="https://picsum.photos/id/1015/800/500"
            alt="Valley with a river"
          />
          <h2>Card two</h2>
        </div>

        <div class="card">
          <img
            src="https://picsum.photos/id/1016/800/500"
            alt="Rocky canyon at dusk"
          />
          <h2>Card three</h2>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <tr>
            <th>Plan</th>
            <th>Storage</th>
            <th>Users</th>
            <th>Support</th>
            <th>Price</th>
          </tr>

          <tr>
            <td>Basic</td>
            <td>10 GB</td>
            <td>1</td>
            <td>Email</td>
            <td>₹0</td>
          </tr>

          <tr>
            <td>Pro</td>
            <td>100 GB</td>
            <td>5</td>
            <td>Chat</td>
            <td>₹499</td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
